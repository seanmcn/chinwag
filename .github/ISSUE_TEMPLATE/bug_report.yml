name: Bug report
description: Something in Chinwag isn't working the way it should.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! A few ground rules first:

        **Never paste real chat content** in this report. Redact names,
        phone numbers, and any message text before sharing logs or
        screenshots — Chinwag is built to analyse private conversations
        and we want to keep them that way.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect to see, and what did you actually see?
      placeholder: |
        I clicked Analyse on a 12 MB iOS export and ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can reproduce it.
      placeholder: |
        1. Open Chinwag
        2. Click "Open chat export…"
        3. Select Foo.zip
        4. ...
    validations:
      required: true

  - type: dropdown
    id: chat-source
    attributes:
      label: Chat export type
      description: How was the chat exported?
      options:
        - iOS — Export Chat → .zip
        - iOS — Export Chat → .txt
        - Android — Export chat → .zip
        - Android — Export chat → .txt
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (desktop app)
        - Windows (desktop app)
        - Linux (CLI only)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Chinwag version
      description: The release tag (e.g. `v0.3.0`) or commit SHA you're running.
      placeholder: v0.3.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: |
        Optional. CLI error text, dev console output (View → Toggle Developer Tools
        in `wails dev`), or anything else that looks relevant. **Redact private content.**
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed any private chat content from this report.
          required: true
