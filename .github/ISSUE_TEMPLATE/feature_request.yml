name: Feature request
description: Suggest a new stat, view, or improvement.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What gap or annoyance prompted this request? (Not "I want X" but "I'm trying to do Y and …")
      placeholder: |
        When comparing two friendships I have to keep flipping tabs to see ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed feature or change. Sketches and mockups welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Anything you tried, or other approaches that could solve the same problem.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Roughly what part of Chinwag does this touch?
      options:
        - Desktop UI / dashboard
        - Analysis / stats
        - CLI
        - Build / packaging / release
        - Documentation
        - Other / not sure
    validations:
      required: true
